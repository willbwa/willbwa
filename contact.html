<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact : Willbwa, artisan du bois en Belgique</title>
<meta name="description" content="Contacte Willbwa pour une question, une réservation ou une création sur mesure en bois. Téléphone, e-mail et Instagram.">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
<main><section><h1>Contact</h1>
<p class="lead">Une question, une idée de cadeau personnalisé, une création sur mesure ? Écris-moi.</p>
<dl class="infos" id="infos"></dl>
<form id="f-contact">
<label>Nom<input name="nom" required maxlength="80" autocomplete="name"></label>
<label>E-mail<input name="email" type="email" required maxlength="120" autocomplete="email"></label>
<label>Message<textarea name="message" rows="5" required maxlength="1500"></textarea></label>
<input class="piege" name="piege" tabindex="-1" autocomplete="off" aria-hidden="true">
<label style="font-weight:400;display:flex;gap:8px;align-items:flex-start"><input type="checkbox" required style="width:auto;margin-top:5px"><span>J’accepte que mes données servent uniquement à répondre à ma demande. Elles ne sont pas partagées.</span></label>
<button class="btn" type="submit">Envoyer le message</button><p class="msg" id="m-contact" role="status"></p>
</form></section>
<section><div class="insta"><img src="instagram-qr.png" alt="QR code de la page Instagram artisan_willbwa" width="150" height="171">
<div><h2>Instagram</h2><p>Scanne le code ou clique : @artisan_willbwa</p>
<a class="btn" href="https://www.instagram.com/artisan_willbwa/" target="_blank" rel="noopener">Ouvrir Instagram</a></div></div></section></main>
<script src="site.js"></script>
</body>
</html>
