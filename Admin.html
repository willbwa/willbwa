<!DOCTYPE html>
<html lang="fr">
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://accounts.google.com/gsi/client" async defer onload="boot()"></script>
  <style>
    :root{color-scheme:light;--ink:#392718;--paper:#fbf6ed;--cream:#f1e4ce;--gold:#b7833e;--line:#dfd0b8}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}
    header{background:#4a3320;color:#fff4e3;padding:22px max(20px,calc((100% - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}
    header h1{font-size:24px;margin:0}header p{margin:2px 0 0;color:#e3d3b9;font-size:14px}
    main{max-width:1120px;margin:28px auto;padding:0 18px}.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:22px;margin-bottom:18px;box-shadow:0 4px 16px #3927180a}
    .hidden{display:none!important}.muted{color:#766653}.error{color:#9a3025}.success{color:#27613e}
    button,input,select,textarea{font:inherit}button{border:0;border-radius:9px;padding:10px 15px;background:var(--gold);color:#fff;font-weight:650;cursor:pointer}button.secondary{background:var(--cream);color:var(--ink)}button:disabled{opacity:.55;cursor:wait}
    nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}nav button{background:#e8d9c1;color:var(--ink)}nav button.active{background:#4a3320;color:white}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:14px;font-weight:650}.field input,.field select,.field textarea{width:100%;border:1px solid #cdbb9e;border-radius:8px;padding:10px;background:#fffdf9;color:var(--ink)}.field textarea{min-height:80px}
    .tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee3d2;vertical-align:top}th{background:#f8f0e2;white-space:nowrap}
    .sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.sectionhead h2{margin:0;font-size:21px}
    #googleBtn{margin-top:12px}#status{min-height:24px;margin:12px 0}
    @media(max-width:600px){header{align-items:flex-start;flex-direction:column}main{margin:16px auto}.panel{padding:16px}}
  </style>
</head>
<body>
<header><div><h1>Willbwa · Espace privé</h1><p>Gestion des créations et de l’activité</p></div><button id="logout" class="secondary hidden">Se déconnecter</button></header>
<main>
  <section id="login" class="panel">
    <h2>Connexion sécurisée</h2><p class="muted">Connecte-toi avec l’un des comptes Google autorisés.</p>
    <div id="googleBtn"></div><p id="status" role="status"></p>
  </section>
  <section id="app" class="hidden">
    <nav id="nav"></nav>
    <div id="content"></div>
  </section>
</main>
<script>
  let idToken='', active='Résumé', cache={};
  const $=id=>document.getElementById(id);
  const tabs=['Résumé','Catalogue','Marchés','Réservations','Messages','Projets','Dépenses','Ventes','Mouvements','Statistiques'];
  const headers={Catalogue:['id','nom','categorie','description','prix','photo','disponibilite','quantite','visible','essence','dimensions','finition','ordre','cout_fabrication'],Marches:['date','date_fin','lieu','horaires','remarque','public','photos'],Reservations:['date_heure','client','email','telephone','articles','total','statut','remise','marche','adresse','note'],Messages:['date_heure','nom','email','message'],Projets:['date_heure','type','creation','prenom','email','projet','usage','modification','description','dimensions','bois','budget','photos','statut'],Depenses:['date','description','notes','montant','mode_paiement','source','fournisseur'],Ventes:['date','creation','quantite','prix_unitaire','lieu','mode_paiement','note'],Mouvements:['date','type','montant','de','vers','note'],Statistiques:['date_heure','evenement','page','article_id','article_nom']};
  const labels={id:'Identifiant',nom:'Nom',categorie:'Catégorie',description:'Description',prix:'Prix (€)',photo:'Photo / lien',disponibilite:'Disponibilité',quantite:'Quantité en stock',visible:'Visible',essence:'Essence',dimensions:'Dimensions',finition:'Finition',ordre:'Ordre',cout_fabrication:'Coût de fabrication estimé (€) · privé',date:'Date',date_fin:'Date de fin',lieu:'Lieu',horaires:'Horaires',remarque:'Remarque',public:'Publié',photos:'Photos',date_heure:'Date et heure',client:'Client',email:'E-mail',telephone:'Téléphone',articles:'Articles',total:'Total (€)',statut:'Statut',remise:'Remise',marche:'Marché',adresse:'Adresse',note:'Note',message:'Message',nom_client:'Nom',type:'Type',creation:'Création',prenom:'Prénom',projet:'Projet',usage:'Utilisation',modification:'Modification souhaitée',bois:'Bois',budget:'Budget (€)',notes:'Notes',montant:'Montant (€)',mode_paiement:'Portefeuille',source:'Source',fournisseur:'Fournisseur',quantite:'Quantité',prix_unitaire:'Prix unitaire (€)',de:'Depuis',vers:'Vers',evenement:'Événement',page:'Page',article_id:'ID création',article_nom:'Nom de la création'};
  function todayLocal(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
  function setCache(r){cache=r.donnees||{};cache.Compteurs=r.compteurs||{};cache.StatistiquesResume=r.statistiquesResume||{};cache.ResumeFinancier=r.resumeFinancier||{};cache.AlertesFinancieres=r.alertesFinancieres||[];}
  function status(t,kind=''){ $('status').className=kind; $('status').textContent=t; }
  function call(action,payload={}){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||String(e)))).adminApi(idToken,action,payload));}
  function boot(){google.script.run.withSuccessHandler(cfg=>{if(!cfg||!cfg.clientId){status('La connexion privée doit être configurée dans Apps Script.','error');return;}google.accounts.id.initialize({client_id:cfg.clientId,callback:res=>{idToken=res.credential;load();}});google.accounts.id.renderButton($('googleBtn'),{theme:'outline',size:'large',text:'signin_with',shape:'pill',locale:'fr'});}).withFailureHandler(e=>status(e.message||String(e),'error')).adminBootstrap();}
  function showApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden'); }
  function logout(){idToken='';cache={};$('app').classList.add('hidden');$('login').classList.remove('hidden');$('logout').classList.add('hidden');status('Déconnecté.');$('googleBtn').replaceChildren();boot();}
  $('logout').addEventListener('click',logout);
  async function load(){status('Vérification du compte…');try{const r=await call('admin_lire');if(!r.ok)throw Error(r.erreur||'Lecture impossible');setCache(r);showApp();renderNav();render();status('Connecté.','success');}catch(e){idToken='';status(e.message,'error');}}
  function renderNav(){const n=$('nav');n.replaceChildren();tabs.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.className=t===active?'active':'';b.onclick=()=>{active=t;renderNav();render();};n.appendChild(b);});}
  function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x;}
  function render(){const c=$('content');c.replaceChildren();if(active==='Résumé'){summary(c);return;}if(active==='Statistiques'){statistics(c);return;}if(['Dépenses','Ventes','Mouvements'].includes(active)){finance(c);return;}if(active==='Catalogue'||active==='Marchés'){createRecord(c,active==='Catalogue'?'Catalogue':'Marches');}const sheet=active==='Catalogue'?'Catalogue':active==='Marchés'?'Marches':active==='Réservations'?'Reservations':active==='Messages'?'Messages':'Projets';table(c,sheet);}
  function summary(c){const box=el('section',undefined,'panel');box.appendChild(el('h2','Vue d’ensemble'));const f=cache.ResumeFinancier||{};const sales=Number(f.ventes)||0,expenses=Number(f.depenses)||0,cash=Number(f.liquide)||0,bank=Number(f.banque)||0;const eur=n=>n.toLocaleString('fr-BE',{style:'currency',currency:'EUR'});const g=el('div',undefined,'grid');const counts=cache.Compteurs||{};const cards=[['Créations',counts.Catalogue??cache.Catalogue?.length??0],['Réservations',counts.Reservations??cache.Reservations?.length??0],['Messages',counts.Messages??cache.Messages?.length??0],['Projets personnalisés',counts.Projets??cache.Projets?.length??0],['Portefeuille liquide',eur(cash)],['Portefeuille bancaire',eur(bank)],['Ventes enregistrées',eur(sales)],['Résultat ventes − dépenses',eur(sales-expenses)]];cards.forEach(([label,val])=>{const p=el('div',undefined,'panel');p.appendChild(el('div',label,'muted'));p.appendChild(el('h2',String(val)));g.appendChild(p);});box.appendChild(g);const alerts=cache.AlertesFinancieres||[];if(alerts.length){const warning=el('div',undefined,'panel');warning.style.border='1px solid #b3401f';warning.appendChild(el('h3','À vérifier dans les données financières'));alerts.forEach(a=>warning.appendChild(el('p','• '+a)));box.appendChild(warning);}box.appendChild(el('p','Les soldes sont calculés à partir des entrées enregistrées ici. Vérifie les modes de paiement et les transferts avant de t’y fier pour la comptabilité.','muted'));c.appendChild(box);}
  function statistics(c){const s=cache.StatistiquesResume||{},events=s.evenements||{},pages=s.pages||{},articles=s.articles||{};const box=el('section',undefined,'panel'),head=el('div',undefined,'sectionhead');head.appendChild(el('h2','Statistiques du site'));const refresh=el('button','Actualiser');refresh.onclick=async()=>{refresh.disabled=true;try{const r=await call('admin_lire');setCache(r);render();status('Statistiques actualisées.','success');}catch(e){status(e.message,'error');}finally{refresh.disabled=false;}};head.appendChild(refresh);box.appendChild(head);const grid=el('div',undefined,'grid');[['Visites enregistrées',events.visite||0],['Consultations de créations',events.article_consulte||0],['Ajouts à la sélection',events.ajout_selection||0],['Réservations reçues',events.reservation_recue||0]].forEach(([label,value])=>{const p=el('div',undefined,'panel');p.appendChild(el('div',label,'muted'));p.appendChild(el('h2',String(value)));grid.appendChild(p);});box.appendChild(grid);const pg=el('div',undefined,'panel');pg.appendChild(el('h3','Pages les plus visitées'));const pageNames=Object.keys(pages).sort((a,b)=>pages[b]-pages[a]);if(!pageNames.length)pg.appendChild(el('p','Aucune visite enregistrée pour le moment.','muted'));else pageNames.forEach(k=>pg.appendChild(el('p',k+' : '+pages[k])));box.appendChild(pg);const ap=el('div',undefined,'panel');ap.appendChild(el('h3','Créations les plus consultées'));const names=Object.keys(articles).sort((a,b)=>articles[b].vues-articles[a].vues);if(!names.length)ap.appendChild(el('p','Aucune consultation de création enregistrée.','muted'));else{const t=el('table'),h=el('tr');['Création','Vues','Ajouts à la sélection'].forEach(x=>h.appendChild(el('th',x)));t.appendChild(h);names.slice(0,20).forEach(k=>{const tr=el('tr');[k,articles[k].vues,articles[k].selections].forEach(x=>tr.appendChild(el('td',String(x))));t.appendChild(tr);});ap.appendChild(t);}box.appendChild(ap);box.appendChild(el('p','Compteurs calculés sur tout l’historique des événements anonymes. Le tableau brut reste limité aux 1 500 derniers événements.','muted'));c.appendChild(box);}
  function table(c,sheet){const box=el('section',undefined,'panel'),head=el('div',undefined,'sectionhead');head.appendChild(el('h2',active));const refresh=el('button','Actualiser');refresh.onclick=async()=>{try{const r=await call('admin_lire');setCache(r);render();}catch(e){status(e.message,'error');}};head.appendChild(refresh);box.appendChild(head);const rows=cache[sheet]||[],cols=headers[sheet]||[];const search=el('input');search.type='search';search.placeholder='Rechercher dans '+active.toLowerCase()+'…';search.setAttribute('aria-label','Rechercher dans '+active);search.style.cssText='width:100%;max-width:440px;margin:14px 0;padding:10px;border:1px solid #cdbb9e;border-radius:8px';box.appendChild(search);if(!rows.length)box.appendChild(el('p','Aucune donnée pour le moment.','muted'));else{const wrap=el('div',undefined,'tablewrap'),t=el('table'),thead=el('thead'),tr=el('tr');cols.forEach(k=>tr.appendChild(el('th',labels[k]||k)));thead.appendChild(tr);t.appendChild(thead);const body=el('tbody');rows.slice().reverse().forEach(row=>{const tr=el('tr');cols.forEach(k=>{const td=el('td',row[k]===undefined?'':String(row[k]));if((sheet==='Reservations'&&k==='statut')||(sheet==='Projets'&&k==='statut')){const sel=document.createElement('select');const opts=sheet==='Reservations'?['nouvelle','confirmée','payée','prête','remise ou envoyée','annulée']:['nouvelle','en discussion','acceptée','refusée','terminée'];opts.forEach(o=>{const op=el('option',o);op.value=o;sel.appendChild(op);});sel.value=String(row[k]||opts[0]);td.replaceChildren(sel);const save=el('button','OK');save.className='secondary';save.style.marginTop='6px';save.onclick=async()=>{save.disabled=true;try{const rr=await call('admin_modifier',{feuille:sheet,ligne:row.__ligne,champs:{statut:sel.value}});if(!rr.ok)throw Error(rr.erreur||'Modification impossible');const fresh=await call('admin_lire');setCache(fresh);render();status('Statut mis à jour.','success');}catch(e){status(e.message,'error');}finally{save.disabled=false;}};td.appendChild(document.createElement('br'));td.appendChild(save);}tr.appendChild(td);});if(['Catalogue','Marches','Reservations','Depenses','Ventes','Mouvements','Projets'].includes(sheet)){const td=el('td');const edit=el('button','Modifier');edit.className='secondary';edit.onclick=async()=>{const fields=sheet==='Catalogue'?['nom','categorie','description','prix','photo','disponibilite','quantite','visible','essence','dimensions','finition','ordre','cout_fabrication']:sheet==='Marches'?['date','date_fin','lieu','horaires','remarque','public','photos']:sheet==='Depenses'?['date','description','notes','montant','mode_paiement','source','fournisseur']:sheet==='Ventes'?['date','creation','quantite','prix_unitaire','lieu','mode_paiement','note']:sheet==='Projets'?['creation','usage','modification','description','dimensions','bois','budget']:sheet==='Reservations'?['note','remise','marche','adresse']:['date','type','montant','de','vers','note'];const changes={};for(const key of fields){const dateField=key==='date'||key==='date_fin';const current=String(row[key]??'');const initial=dateField?current.slice(0,10):current;const hint=key==='date'?' (obligatoire, format AAAA-MM-JJ, Annuler = arrêter)':' (vide = effacer, Annuler = arrêter)';const value=window.prompt('Nouvelle valeur pour '+(labels[key]||key)+hint,initial);if(value===null)return;changes[key]=value;}if(!Object.keys(changes).length)return;edit.disabled=true;try{const rr=await call('admin_modifier',{feuille:sheet,ligne:row.__ligne,champs:changes});if(!rr.ok)throw Error(rr.erreur||'Modification impossible');const fresh=await call('admin_lire');setCache(fresh);render();status('Mise à jour enregistrée.','success');}catch(e){status(e.message,'error');}finally{edit.disabled=false;}};td.appendChild(edit);if(sheet==='Catalogue'||sheet==='Marches'){const field=sheet==='Catalogue'?'visible':'public';const toggle=el('button',String(row[field]||'').toLowerCase()==='oui'?'Masquer':'Publier');toggle.className='secondary';toggle.style.marginLeft='6px';toggle.onclick=async()=>{toggle.disabled=true;try{const rr=await call('admin_modifier',{feuille:sheet,ligne:row.__ligne,champs:{[field]:String(row[field]||'').toLowerCase()==='oui'?'non':'oui'}});if(!rr.ok)throw Error(rr.erreur||'Modification impossible');const fresh=await call('admin_lire');setCache(fresh);render();status(sheet==='Catalogue'?'Visibilité de la création mise à jour.':'Publication du marché mise à jour.','success');}catch(e){status(e.message,'error');}finally{toggle.disabled=false;}};td.appendChild(toggle);}tr.appendChild(td);}body.appendChild(tr);});t.appendChild(body);wrap.appendChild(t);search.addEventListener('input',()=>{const q=search.value.trim().toLocaleLowerCase('fr');Array.from(body.rows).forEach(row=>{row.hidden=!row.textContent.toLocaleLowerCase('fr').includes(q);});});box.appendChild(wrap);}c.appendChild(box);}
  function createRecord(c,sheet){const box=el('section',undefined,'panel');box.appendChild(el('h2',sheet==='Catalogue'?'Ajouter une création':'Ajouter un marché'));const form=el('form');form.className='grid';const specs=sheet==='Catalogue'?[['nom','Nom','text'],['categorie','Catégorie','text'],['description','Description','textarea'],['prix','Prix (€)','number'],['photo','Lien de la photo','url'],['disponibilite','Disponibilité','select',['en stock','sur commande','épuisé','ancien']],['quantite','Quantité en stock (0 si aucun exemplaire)','number'],['visible','Visible sur le site','select',['oui','non']],['essence','Essence','text'],['dimensions','Dimensions','text'],['finition','Finition','text'],['ordre','Ordre d’affichage','number'],['cout_fabrication','Coût estimé de fabrication (€) · privé','number']]:[['date','Date','date'],['date_fin','Date de fin (facultatif)','date'],['lieu','Lieu','text'],['horaires','Horaires','text'],['remarque','Remarque','textarea'],['public','Afficher sur le site','select',['oui','non']],['photos','Liens des photos (séparés par des virgules)','textarea']];const vals={};specs.forEach(([key,label,type,opts])=>{vals[key]=field(form,label,key,type,opts);});if(sheet==='Marches')vals.date.value=todayLocal();if(sheet==='Catalogue'){vals.quantite.min='0';vals.quantite.step='1';vals.quantite.value='1';}const submit=el('button','Créer');submit.type='submit';form.appendChild(submit);form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;try{const champs={};Object.entries(vals).forEach(([k,v])=>champs[k]=v.value.trim());const r=await call('admin_creer',{feuille:sheet,champs});if(!r.ok)throw Error(r.erreur||'Création impossible');const fresh=await call('admin_lire');setCache(fresh);render();status('Enregistré.','success');}catch(err){status(err.message,'error');}finally{submit.disabled=false;}});box.appendChild(form);c.appendChild(box);}
  function field(form,label,name,type='text',opts){const wrap=el('div',undefined,'field'),lab=el('label',label);lab.htmlFor=name;wrap.appendChild(lab);let input;if(opts){input=document.createElement('select');opts.forEach(o=>{const op=el('option',o);op.value=o;input.appendChild(op);});}else input=document.createElement(type==='textarea'?'textarea':'input');input.id=name;input.name=name;if(type!=='textarea'&&!opts)input.type=type;wrap.appendChild(input);form.appendChild(wrap);return input;}
  function finance(c){const box=el('section',undefined,'panel'),h=el('div',undefined,'sectionhead');h.appendChild(el('h2','Nouvelle entrée · '+active));box.appendChild(h);const form=el('form');form.className='grid';const date=field(form,'Date','date','date');date.value=todayLocal();
    const sheet=active==='Dépenses'?'Depenses':active==='Ventes'?'Ventes':'Mouvements';
    let inputs={};if(sheet==='Depenses'){inputs.description=field(form,'Description','description');inputs.description.required=true;inputs.notes=field(form,'Notes (facultatif)','notes','textarea');inputs.montant=field(form,'Montant (€)','montant','number');inputs.montant.min='0.01';inputs.montant.step='0.01';inputs.montant.required=true;inputs.mode_paiement=field(form,'Portefeuille','mode_paiement',null,['liquide','banque']);inputs.source=field(form,'Source','source');inputs.fournisseur=field(form,'Fournisseur (facultatif)','fournisseur');}
    if(sheet==='Ventes'){const creations=[...new Set((cache.Catalogue||[]).map(r=>String(r.nom||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'fr'));inputs.creation=creations.length?field(form,'Création vendue','creation',null,['— Choisir une création —',...creations]):field(form,'Création vendue','creation');inputs.creation.required=true;if(creations.length){inputs.creation.options[0].value='';inputs.creation.options[0].disabled=true;inputs.creation.options[0].selected=true;}inputs.quantite=field(form,'Quantité','quantite','number');inputs.quantite.min='1';inputs.quantite.step='1';inputs.quantite.required=true;inputs.prix_unitaire=field(form,'Prix unitaire (€)','prix_unitaire','number');inputs.prix_unitaire.min='0.01';inputs.prix_unitaire.step='0.01';inputs.prix_unitaire.required=true;inputs.lieu=field(form,'Lieu / marché','lieu');inputs.mode_paiement=field(form,'Portefeuille reçu','mode_paiement',null,['liquide','banque']);inputs.note=field(form,'Note','note','textarea');}
    if(sheet==='Mouvements'){inputs.type=field(form,'Type de mouvement','type',null,['transfert']);inputs.montant=field(form,'Montant (€)','montant','number');inputs.montant.min='0.01';inputs.montant.step='0.01';inputs.montant.required=true;inputs.de=field(form,'De','de',null,['liquide','banque']);inputs.vers=field(form,'Vers','vers',null,['banque','liquide']);inputs.note=field(form,'Note','note');}
    form.prepend(date);const submit=el('button','Enregistrer');submit.type='submit';form.appendChild(submit);form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;try{const champs={date:date.value};Object.entries(inputs).forEach(([k,v])=>champs[k]=v.value.trim());const r=await call('admin_creer',{feuille:sheet,champs});if(!r.ok)throw Error(r.erreur||'Échec de l’enregistrement');status('Enregistré.','success');const data=await call('admin_lire');setCache(data);render();form.reset();}catch(err){status(err.message,'error');}finally{submit.disabled=false;}});box.appendChild(form);c.appendChild(box);table(c,sheet);}
</script>
</body>
</html>
